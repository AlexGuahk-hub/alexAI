// ================================================================
// ENGINE
// ================================================================
class GameLoop {
  constructor(u,r){ this.update=u; this.render=r; this.running=false; this.rafId=null; this.FT=1000/60; this.acc=0; this.last=0; }
  start(){ this.running=true; this.last=performance.now(); this.rafId=requestAnimationFrame(this._tick.bind(this)); }
  stop(){ this.running=false; if(this.rafId){cancelAnimationFrame(this.rafId);this.rafId=null;} }
  _tick(now){ if(!this.running)return; this.acc+=Math.min(now-this.last,this.FT*5); this.last=now; while(this.acc>=this.FT){this.update(this.FT/1000);this.acc-=this.FT;} this.render(); this.rafId=requestAnimationFrame(this._tick.bind(this)); }
}

class SceneManager {
  constructor(){ this.stack=[]; }
  get current(){ return this.stack[this.stack.length-1]??null; }
  push(s){ this.current?.onPause?.(); this.stack.push(s); s.onEnter?.(); }
  pop(){ const s=this.stack.pop(); s?.onExit?.(); this.current?.onResume?.(); return s; }
  replace(s){ const o=this.stack.pop(); o?.onExit?.(); this.stack.push(s); s.onEnter?.(); }
  update(dt){ this.current?.update?.(dt); }
  render(ctx){ for(const s of this.stack) s.render?.(ctx); }
}

const KEY_MAP={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',KeyZ:'confirm',KeyX:'cancel',Enter:'confirm',Escape:'cancel'};
class InputManager {
  constructor(){ this._h=new Set(); this._p=new Set(); this._r=new Set(); this._kd=this._kd.bind(this); this._ku=this._ku.bind(this); window.addEventListener('keydown',this._kd); window.addEventListener('keyup',this._ku); }
  _kd(e){ const a=KEY_MAP[e.code]; if(!a)return; e.preventDefault(); if(!this._h.has(a))this._p.add(a); this._h.add(a); }
  _ku(e){ const a=KEY_MAP[e.code]; if(!a)return; this._h.delete(a); this._r.add(a); }
  isHeld(a){ return this._h.has(a); }
  isPressed(a){ return this._p.has(a); }
  flush(){ this._p.clear(); this._r.clear(); }
}

class AudioManager {
  constructor(){ this._ctx=null; this._sg=null; }
  _init(){ if(this._ctx)return; this._ctx=new(window.AudioContext||window.webkitAudioContext)(); const m=this._ctx.createGain(); m.gain.value=0.5; m.connect(this._ctx.destination); this._sg=this._ctx.createGain(); this._sg.gain.value=0.6; this._sg.connect(m); }
  resume(){ this._init(); if(this._ctx.state==='suspended')this._ctx.resume(); }
  _beep(type,freq,dur,vol=0.12){ this._init(); const c=this._ctx,o=c.createOscillator(),g=c.createGain(); o.type=type; o.frequency.value=freq; g.gain.setValueAtTime(vol,c.currentTime); g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+dur); o.connect(g); g.connect(this._sg); o.start(c.currentTime); o.stop(c.currentTime+dur); }
  playSfxTyping(){ this._beep('sine',200+Math.random()*300,0.06,0.15); }
  playSfxSelect(){ this._beep('square',440,0.08,0.1); }
  playSfxConfirm(){ [523,659,784].forEach((f,i)=>{ this._init(); const c=this._ctx,o=c.createOscillator(),g=c.createGain(),t=c.currentTime+i*0.08; o.type='square'; o.frequency.value=f; g.gain.setValueAtTime(0.12,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.1); o.connect(g); g.connect(this._sg); o.start(t); o.stop(t+0.1); }); }
  playSfxHit(){ this._init(); const c=this._ctx,b=c.createBuffer(1,c.sampleRate*0.12,c.sampleRate),d=b.getChannelData(0); for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length); const s=c.createBufferSource(),g=c.createGain(); s.buffer=b; g.gain.value=0.3; s.connect(g); g.connect(this._sg); s.start(); }
  playSfxSave(){ [261,330,392,523,659].forEach((f,i)=>{ this._init(); const c=this._ctx,o=c.createOscillator(),g=c.createGain(),t=c.currentTime+i*0.1; o.type='sine'; o.frequency.value=f; g.gain.setValueAtTime(0.15,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.15); o.connect(g); g.connect(this._sg); o.start(t); o.stop(t+0.15); }); }
  playSfxStep(){ this._beep('triangle',80+Math.random()*40,0.05,0.06); }
}

// ================================================================
// DIALOGUE BOX
// ================================================================
class DialogueBox {
  constructor(canvas,audio){ this.canvas=canvas; this.audio=audio; this.visible=false; this._lines=[]; this._pi=0; this._ci=0; this._timer=0; this._cb=null; this._spk=''; this._done=false; this._bt=0; this._bon=true; }
  show(lines,cb,speaker=''){ this._lines=lines; this._pi=0; this._ci=0; this._timer=0; this._cb=cb; this._spk=speaker; this._done=false; this.visible=true; }
  hide(){ this.visible=false; }
  advance(){ if(!this.visible)return; if(!this._done){this._ci=this._lines[this._pi].length;this._done=true;return;} this._pi++; if(this._pi>=this._lines.length){this.visible=false;this._cb?.();return;} this._ci=0;this._timer=0;this._done=false; }
  update(dt){ if(!this.visible||this._done){this._bt+=dt;if(this._bt>=0.4){this._bt=0;this._bon=!this._bon;}return;} this._timer+=dt; while(this._timer>=0.04&&this._ci<this._lines[this._pi].length){this._timer-=0.04;this._ci++;if(this._ci%2===0)this.audio.playSfxTyping();} if(this._ci>=this._lines[this._pi].length)this._done=true; }
  render(ctx){ if(!this.visible)return; const W=this.canvas.width,H=this.canvas.height,P=16,BH=120,bx=P,by=H-BH-20,bw=W-P*2; ctx.fillStyle='#000'; ctx.fillRect(bx,by,bw,BH); ctx.strokeStyle='#fff'; ctx.lineWidth=3; ctx.strokeRect(bx,by,bw,BH); if(this._spk){ctx.fillStyle='#fff';ctx.font='8px "Press Start 2P",monospace';ctx.fillText(this._spk,bx+P,by-10);} const text=this._lines[this._pi].substring(0,this._ci); ctx.font='8px "Press Start 2P",monospace'; ctx.fillStyle='#fff'; this._wrap(ctx,text,bw-P*2).forEach((l,i)=>ctx.fillText(l,bx+P,by+P+12+i*22)); if(this._done&&this._bon){ctx.fillStyle='#fff';ctx.font='8px "Press Start 2P",monospace';ctx.fillText('v',bx+bw-P-10,by+BH-10);} }
  _wrap(ctx,text,maxW){ const words=text.split(' '),lines=[]; let cur=''; for(const w of words){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;} if(cur)lines.push(cur); return lines; }
}

// ================================================================
// OVERWORLD SCENE  — Phase 3
// ================================================================
class OverworldScene {
  constructor(scenes,input,audio,playerName,saveData=null){
    this.scenes=scenes; this.input=input; this.audio=audio;
    this.playerName=playerName;
    this.canvas=document.getElementById('game-canvas');
    this.dlg=new DialogueBox(this.canvas,audio);
    this.timer=0;
    this.fadeAlpha=1; this.fadeDir=-1; this.fadeCb=null;
    this._exiting=false; this._savedRecently=false;
    this._rnTimer=0; // room name display timer
    this._stepT=0;
    const room=(saveData?.room)||'room1';
    this._loadRoom(room,saveData);
  }

  _loadRoom(id,sd=null){
    this.roomId=id;
    const R=ROOMS[id];
    this.tiles=R.tiles; this.mapW=R.tiles[0].length; this.mapH=R.tiles.length;
    this.npcs=R.npcs.map(n=>({...n,done:false}));
    this.sp=R.savePoint?{...R.savePoint}:null;
    this.exits=R.exits; this.roomName=R.name;
    this._rnTimer=3; this._exiting=false; this._savedRecently=false;
    const s=sd?.tx!=null?{tx:sd.tx,ty:sd.ty}:R.playerStart;
    this.p={ x:s.tx*T+T/2, y:s.ty*T+T/2, facing:'down', wf:0, wt:0, moving:false, speed:110 };
  }

  onEnter(){ this.fadeAlpha=1; this.fadeDir=-1; }
  onExit(){}

  update(dt){
    this.timer+=dt;
    // fade
    if(this.fadeDir===-1&&this.fadeAlpha>0){ this.fadeAlpha=Math.max(0,this.fadeAlpha-dt*2.5); }
    else if(this.fadeDir===1&&this.fadeAlpha<1){ this.fadeAlpha=Math.min(1,this.fadeAlpha+dt*2.5); if(this.fadeAlpha>=1&&this.fadeCb){this.fadeCb();this.fadeCb=null;} }
    this.dlg.update(dt);
    if(this.dlg.visible){ if(this.input.isPressed('confirm')){this.audio.playSfxSelect();this.dlg.advance();} return; }
    if(this._rnTimer>0) this._rnTimer-=dt;
    this._move(dt);
  }

  _move(dt){
    if(this._exiting)return;
    const p=this.p;
    let dx=0,dy=0;
    if(this.input.isHeld('left')){dx=-1;p.facing='left';}
    if(this.input.isHeld('right')){dx=1;p.facing='right';}
    if(this.input.isHeld('up')){dy=-1;p.facing='up';}
    if(this.input.isHeld('down')){dy=1;p.facing='down';}
    if(dx&&dy){dx*=0.707;dy*=0.707;}
    p.moving=!!(dx||dy);
    if(p.moving){
      const spd=p.speed*dt;
      const nx=p.x+dx*spd, ny=p.y+dy*spd;
      if(!this._wall(nx,p.y)) p.x=nx;
      if(!this._wall(p.x,ny)) p.y=ny;
      p.wt+=dt; if(p.wt>=0.14){p.wt=0;p.wf=1-p.wf;}
      this._stepT+=dt; if(this._stepT>=0.28){this._stepT=0;this.audio.playSfxStep();}
    } else { p.wf=0; }

    // Z = interact
    if(this.input.isPressed('confirm')) this._interact();

    // exit check
    const ptx=Math.floor(p.x/T), pty=Math.floor(p.y/T);
    for(const ex of this.exits){ if(ptx===ex.tx&&pty===ex.ty){this._exit(ex);return;} }

    // save point
    if(this.sp&&!this._savedRecently){
      const ddx=p.x-(this.sp.tx*T+T/2), ddy=p.y-(this.sp.ty*T+T/2);
      if(Math.hypot(ddx,ddy)<T*0.9) this._save();
    }
  }

  _wall(cx,cy){
    const hw=10,hh=10;
    for(const [px,py] of [[cx-hw,cy-hh],[cx+hw,cy-hh],[cx-hw,cy+hh],[cx+hw,cy+hh]]){
      const tx=Math.floor(px/T),ty=Math.floor(py/T);
      if(tx<0||ty<0||tx>=this.mapW||ty>=this.mapH) return true;
      if(this.tiles[ty][tx]===1) return true;
    }
    return false;
  }

  _interact(){
    const p=this.p;
    const ptx=Math.floor(p.x/T), pty=Math.floor(p.y/T);
    const ftx=ptx+(p.facing==='right'?1:p.facing==='left'?-1:0);
    const fty=pty+(p.facing==='down'?1:p.facing==='up'?-1:0);
    for(const npc of this.npcs){
      if(npc.tx===ftx&&npc.ty===fty){
        this.dlg.show(NPC_LINES[npc.id]||['* ...'],()=>{npc.done=true;},NPC_NAMES[npc.id]||'');
        return;
      }
    }
  }

  _save(){
    this._savedRecently=true;
    setTimeout(()=>{this._savedRecently=false;},4000);
    this.audio.playSfxSave();
    localStorage.setItem('undertale_save',JSON.stringify({name:this.playerName,room:this.roomId,tx:Math.floor(this.p.x/T),ty:Math.floor(this.p.y/T)}));
    this.dlg.show(['* THE RUINS','* '+this.playerName+"'S DETERMINATION grows stronger.",'* (Game saved)'],()=>{},'* SAVE POINT');
  }

  _exit(ex){
    if(this._exiting)return;
    this._exiting=true; this.fadeDir=1;
    this.fadeCb=()=>{ this._loadRoom(ex.toRoom); this.fadeDir=-1; };
  }

  // ---- RENDER ----
  render(ctx){
    this._tiles(ctx);
    this._savePt(ctx);
    this._drawNpcs(ctx);
    this._drawPlayer(ctx);
    this._hud(ctx);
    this.dlg.render(ctx);
    if(this.fadeAlpha>0){ctx.fillStyle=`rgba(0,0,0,${this.fadeAlpha})`;ctx.fillRect(0,0,640,480);}
  }

  _tiles(ctx){
    for(let ty=0;ty<this.mapH;ty++){
      for(let tx=0;tx<this.mapW;tx++){
        const tile=this.tiles[ty][tx], x=tx*T, y=ty*T;
        if(tile===1){
          ctx.fillStyle='#3d1f08'; ctx.fillRect(x,y,T,T);
          ctx.fillStyle='#4e2a0c'; ctx.fillRect(x+2,y+2,T-4,T/2-2);
          ctx.fillStyle='#2a1205'; ctx.fillRect(x,y+T-4,T,4);
        } else if(tile===0){
          ctx.fillStyle='#150800'; ctx.fillRect(x,y,T,T);
          ctx.fillStyle='#1e0e00'; ctx.fillRect(x+T/2-1,y+T/2-1,2,2);
        } else if(tile===2){
          ctx.fillStyle='#0a0a1a'; ctx.fillRect(x,y,T,T);
          ctx.fillStyle='#1a1a3a'; ctx.fillRect(x+6,y+4,T-12,T-8);
          const sh=0.35+0.25*Math.sin(this.timer*3+tx);
          ctx.fillStyle=`rgba(100,120,255,${sh})`; ctx.fillRect(x+8,y+6,T-16,4);
        }
      }
    }
  }

  _savePt(ctx){
    if(!this.sp)return;
    const sx=this.sp.tx*T+T/2, sy=this.sp.ty*T+T/2;
    const pulse=0.75+0.25*Math.sin(this.timer*2.5);
    const g=ctx.createRadialGradient(sx,sy,0,sx,sy,T*1.2*pulse);
    g.addColorStop(0,`rgba(255,255,80,${0.22*pulse})`); g.addColorStop(1,'rgba(255,255,0,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(sx,sy,T*1.2*pulse,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=`rgba(255,225,0,${0.85+0.15*pulse})`;
    this._star(ctx,sx,sy-2,13*pulse,6*pulse);
  }

  _drawNpcs(ctx){
    const p=this.p;
    const ptx=Math.floor(p.x/T),pty=Math.floor(p.y/T);
    const ftx=ptx+(p.facing==='right'?1:p.facing==='left'?-1:0);
    const fty=pty+(p.facing==='down'?1:p.facing==='up'?-1:0);
    for(const npc of this.npcs){
      const nx=npc.tx*T+T/2, ny=npc.ty*T+T/2;
      if(npc.id==='flowey') this._flowey(ctx,nx,ny);
      else                   this._genericNpc(ctx,nx,ny);
      if(!this.dlg.visible&&npc.tx===ftx&&npc.ty===fty){
        ctx.fillStyle='#fff'; ctx.font='7px "Press Start 2P",monospace';
        ctx.textAlign='center'; ctx.fillText('[Z]',nx,ny-T/2-6); ctx.textAlign='left';
      }
    }
  }

  _flowey(ctx,x,y){
    const t=this.timer;
    ctx.fillStyle='#3a7200'; ctx.fillRect(x-2,y-2,4,16);
    ctx.fillStyle='#48900a'; ctx.fillRect(x-10,y+2,10,4); ctx.fillRect(x+2,y+4,10,4);
    ctx.fillStyle='#ffe066';
    for(let i=0;i<5;i++){ const a=t*0.9+i*Math.PI*2/5; ctx.beginPath(); ctx.arc(x+15*Math.cos(a),y-8+12*Math.sin(a),5.5,0,Math.PI*2); ctx.fill(); }
    ctx.fillStyle='#ffd700'; ctx.beginPath(); ctx.arc(x,y-8,10,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#333'; ctx.fillRect(x-4,y-11,3,3); ctx.fillRect(x+2,y-11,3,3);
    ctx.strokeStyle='#333'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(x,y-6,4,0.2,Math.PI-0.2); ctx.stroke();
  }

  _genericNpc(ctx,x,y){
    ctx.fillStyle='#6666cc'; ctx.fillRect(x-8,y-18,16,22);
    ctx.fillStyle='#8888ee'; ctx.fillRect(x-6,y-16,12,8);
    ctx.fillStyle='#f5c8a0'; ctx.fillRect(x-5,y-28,10,12);
    ctx.fillStyle='#555'; ctx.font='6px "Press Start 2P",monospace';
    ctx.textAlign='center'; ctx.fillText('???',x,y+10); ctx.textAlign='left';
  }

  _drawPlayer(ctx){
    const p=this.p;
    const x=Math.round(p.x), y=Math.round(p.y), f=p.wf;
    // shadow
    ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(x,y+12,9,4,0,0,Math.PI*2); ctx.fill();
    // legs
    ctx.fillStyle='#2d4a1e';
    if(p.facing==='left'||p.facing==='right'){ ctx.fillRect(x-5,y+5,4,f?3:7); ctx.fillRect(x+1,y+5,4,f?7:3); }
    else { ctx.fillRect(x-5,y+5,4,f?8:4); ctx.fillRect(x+1,y+5,4,f?4:8); }
    // body
    ctx.fillStyle='#3a5ccc'; ctx.fillRect(x-6,y-5,12,11);
    ctx.fillStyle='#5577ee'; ctx.fillRect(x-6,y-2,12,3);
    // head
    ctx.fillStyle='#f5c89a'; ctx.fillRect(x-6,y-17,12,13);
    // hair
    ctx.fillStyle='#7a3b10'; ctx.fillRect(x-6,y-19,12,4); ctx.fillRect(x-8,y-17,3,7);
    // eyes
    ctx.fillStyle='#333';
    if(p.facing==='down'){ ctx.fillRect(x-3,y-12,2,2); ctx.fillRect(x+1,y-12,2,2); }
    else if(p.facing==='left'){ ctx.fillRect(x-4,y-12,2,2); }
    else if(p.facing==='right'){ ctx.fillRect(x+2,y-12,2,2); }
    else{ ctx.fillStyle='#c9956e'; ctx.fillRect(x-6,y-17,12,4); }
  }

  _hud(ctx){
    if(this._rnTimer>0){
      const a=Math.min(1,this._rnTimer*2);
      ctx.fillStyle=`rgba(255,255,255,${a*0.7})`;
      ctx.font='8px "Press Start 2P",monospace'; ctx.textAlign='center';
      ctx.fillText(this.roomName,320,22); ctx.textAlign='left';
    }
    // HP bar
    ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(6,6,130,16);
    ctx.fillStyle='#cc2222'; ctx.fillRect(8,8,126,12);
    ctx.fillStyle='#ff4444'; ctx.fillRect(8,8,126,5);
    ctx.fillStyle='#fff'; ctx.font='6px "Press Start 2P",monospace';
    ctx.fillText(this.playerName+' HP 20/20',10,32);
    if(!this.dlg.visible){ ctx.fillStyle='rgba(255,255,255,0.2)'; ctx.font='6px "Press Start 2P",monospace'; ctx.textAlign='right'; ctx.fillText('Arrows:Move  Z:Talk',634,474); ctx.textAlign='left'; }
  }

  _star(ctx,cx,cy,r1,r2){ ctx.beginPath(); for(let i=0;i<5;i++){ const ao=Math.PI/2+i*Math.PI*2/5,ai=ao+Math.PI/5; if(i===0)ctx.moveTo(cx+r1*Math.cos(ao),cy+r1*Math.sin(ao)); else ctx.lineTo(cx+r1*Math.cos(ao),cy+r1*Math.sin(ao)); ctx.lineTo(cx+r2*Math.cos(ai),cy+r2*Math.sin(ai)); } ctx.closePath(); ctx.fill(); }
}

// ================================================================
// TITLE SCENE
// ================================================================
class TitleScene {
  constructor(scenes,input,audio){ this.scenes=scenes; this.input=input; this.audio=audio; this._cur=0; this._bt=0; this._bon=true; this._phase='title'; this._name=''; this._kd=this._nk.bind(this); }
  onEnter(){ if(!localStorage.getItem('undertale_save'))this._cur=1; }
  onExit(){ window.removeEventListener('keydown',this._kd); }
  _nk(e){ if(this._phase!=='name')return; e.stopImmediatePropagation(); if(e.key==='Backspace')this._name=this._name.slice(0,-1); else if(e.key==='Enter'||e.code==='Enter')this._confirm(); else if(e.key.length===1&&this._name.length<8&&e.key.charCodeAt(0)>=32&&e.key.charCodeAt(0)<127)this._name+=e.key.toUpperCase(); }
  _confirm(){ const n=this._name.trim()||'FRISK'; window.removeEventListener('keydown',this._kd); this.scenes.replace(new OverworldScene(this.scenes,this.input,this.audio,n)); }
  update(dt){ this._bt+=dt; if(this._bt>=0.5){this._bt=0;this._bon=!this._bon;} if(this._phase==='title'){ if(this.input.isPressed('up')){this._cur=(this._cur-1+2)%2;this.audio.playSfxSelect();} if(this.input.isPressed('down')){this._cur=(this._cur+1)%2;this.audio.playSfxSelect();} if(this.input.isPressed('confirm')){ this.audio.playSfxConfirm(); if(this._cur===0){const sv=localStorage.getItem('undertale_save');if(sv){const d=JSON.parse(sv);this.scenes.replace(new OverworldScene(this.scenes,this.input,this.audio,d.name,d));}}else{this._phase='name';this._name='';window.addEventListener('keydown',this._kd);} } } }
  render(ctx){ const W=640,H=480; ctx.fillStyle='#111'; for(let i=0;i<5;i++)ctx.fillRect(30+i*120,H-60,8,8); ctx.fillStyle='#fff'; ctx.font='28px "Press Start 2P",monospace'; ctx.textAlign='center'; ctx.fillText('UNDERTALE',W/2,160); ctx.font='8px "Press Start 2P",monospace'; ctx.fillStyle='#888'; ctx.fillText('- Fan Recreation -',W/2,190); if(this._phase==='title'){ ['CONTINUE','NEW GAME'].forEach((item,i)=>{ const y=280+i*40,active=i===this._cur; ctx.fillStyle=active?'#fff':'#555'; ctx.font='10px "Press Start 2P",monospace'; ctx.fillText(item,W/2,y); if(active&&this._bon){ctx.fillStyle='#fff';ctx.fillText('*',W/2-100,y);} }); ctx.fillStyle='#333'; ctx.font='7px "Press Start 2P",monospace'; ctx.fillText('Z / ENTER to select',W/2,H-40); }else{ ctx.fillStyle='#fff'; ctx.font='10px "Press Start 2P",monospace'; ctx.fillText('ENTER YOUR NAME',W/2,260); const bw=200,bx=W/2-100,by=285; ctx.fillStyle='#000'; ctx.fillRect(bx,by,bw,40); ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.strokeRect(bx,by,bw,40); ctx.fillStyle='#fff'; ctx.font='12px "Press Start 2P",monospace'; ctx.fillText(this._name+(this._bon?'_':' '),W/2,by+26); ctx.fillStyle='#555'; ctx.font='7px "Press Start 2P",monospace'; ctx.fillText('PRESS ENTER TO CONFIRM',W/2,by+60); } ctx.textAlign='left'; }
}

// ================================================================
// BOOT
// ================================================================
const canvas=document.getElementById('game-canvas');
const ctx=canvas.getContext('2d');
ctx.imageSmoothingEnabled=false;

const input=new InputManager();
const audio=new AudioManager();
const scenes=new SceneManager();

window.addEventListener('keydown',()=>audio.resume(),{once:true});
scenes.push(new TitleScene(scenes,input,audio));

const loop=new GameLoop(
  dt=>{scenes.update(dt);input.flush();},
  ()=>{ctx.fillStyle='#000';ctx.fillRect(0,0,640,480);scenes.render(ctx);}
);
loop.start();
</script>
